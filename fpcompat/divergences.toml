# The divergence registry. Edited by people, read by the runner, and printed to users
# as docs/divergences.md, which is generated from this file and never written by hand.
#
# Every entry is an assertion and not an excuse. The runner does not skip a case listed
# here, it runs it and requires the outcome the entry declares, so an entry that stopped
# being true fails the build with a message saying the registry is out of date rather
# than a message blaming the library.
#
# Adding an entry here is done in its own pull request, reviewed on its own, and merged
# before the change that needs it. That is slower on purpose. A registry entry is a
# promise to users about what firepanda does not do, and it should never be possible to
# add one while trying to get a build green.
#
# These seven are the founding entries. They are the seven genuine omissions from the
# firepanda parity document, restated as things a suite can check.

[[divergence]]
id = "engine/plotting"
cases = ["divergences/plotting/*"]
kind = "engine"
reason = "Plotting and styling are a different library's job. pandas ships a matplotlib front end and an HTML styler, and both of them are presentation layers built on top of a dataframe rather than parts of one. firepanda raises on every plotting and styling name with a message pointing at to_pandas(), which is a one line change for a user who wants a chart and several thousand lines the library would otherwise have to carry forever."
spec = "06-pandas-parity.md#the-genuine-omissions"
expect = "raises"
since = "2026-09-04"

[[divergence]]
id = "engine/pickle"
cases = ["divergences/pickle/*"]
kind = "engine"
reason = "Reading a pickle executes whatever code is in it, so read_pickle on an untrusted file is arbitrary code execution with a friendly name. It also pins the file format to the exact class layout of the version that wrote it, which means a pickle is unreadable by any other tool and often by a later pandas. firepanda raises with a pointer to Parquet and Arrow IPC, both of which another program can read and neither of which runs anything on load."
spec = "06-pandas-parity.md#the-genuine-omissions"
expect = "raises"
since = "2026-09-04"

[[divergence]]
id = "engine/object-dtype"
cases = ["divergences/object-dtype/*"]
kind = "engine"
reason = "A column of arbitrary Python objects is a column with no type, no memory layout and no vectorized operation available to it. Every operation on one becomes a loop that reaches into the interpreter once per element, which is where the ten to one performance difference this project exists for disappears. firepanda raises at construction, naming the column and the offending Python type, so the user finds out at the point they can still fix it rather than after their program is written."
spec = "06-pandas-parity.md#the-genuine-omissions"
expect = "raises"
since = "2026-09-04"

[[divergence]]
id = "engine/inplace"
cases = ["divergences/inplace/*"]
kind = "engine"
reason = "The inplace parameter does not save a copy in pandas either, it only hides the assignment, and it makes every call site ambiguous about whether it returns a frame or None. It also makes a chained call silently do nothing. firepanda raises TypeError with the reassignment form in the message, so the fix is visible in the error itself. This affects 42 pandas callables and every one of them has the same one line fix."
spec = "06-pandas-parity.md#the-genuine-omissions"
expect = "raises"
since = "2026-09-04"

[[divergence]]
id = "engine/implicit-index"
cases = ["divergences/implicit-index/*"]
kind = "engine"
reason = "pandas gives every frame an index whether or not anybody asked for one, and then performs operations against it, so loc reads as a label lookup on numbers that are actually positions and reindex against a label nobody declared returns a row of nulls. firepanda has no implicit index, so the operations that need one either take an explicit key or work positionally, and the places where that is visible are fewer than the size of this decision suggests."
spec = "06-pandas-parity.md#the-genuine-omissions"
expect = "differs"
instead = "there is no index unless one was declared. loc takes a declared key or raises, reindex against undeclared labels raises rather than manufacturing null rows, and reset_index has nothing to move into a column."
since = "2026-09-04"

[[divergence]]
id = "engine/regex-lookaround"
cases = ["divergences/regex/*"]
kind = "engine"
reason = "firepanda's regex engine has RE2 semantics, which give a linear time guarantee in exchange for dropping backreferences and lookaround. Both of those constructs need backtracking, and backtracking is what lets one adversarial pattern take exponential time. On a hundred million rows that is not a slow query, it is a hung process. A pattern using either raises with the offending construct named, because the pattern is unsupported rather than invalid and those are different words to the person reading the message."
spec = "06-pandas-parity.md#the-genuine-omissions"
expect = "raises"
since = "2026-09-04"

# The eighth entry, and the only one where firepanda is closer to the truth than pandas
# is rather than deliberately doing less. It is also the only one added after the change
# it covers rather than before it, which the rule at the top of this file says should
# not happen. Recorded rather than tidied away: the change was a precision fix that
# looked like it could only move firepanda towards pandas, and the frames where it moves
# firepanda past pandas were found by measuring afterwards.

[[divergence]]
id = "engine/moment-precision"
cases = ["divergences/moment-precision/*"]
kind = "engine"
reason = "The variance, the standard deviation, the standard error and the skewness are computed from deviations around each group's mean, and the mean is a sum divided by a count, so it is near the true mean and is not it. pandas leaves that error in. firepanda sums the plain deviations alongside the squared ones and subtracts the residual, which costs one addition per row and makes the answer independent of how accurate the centre was. On ordinary columns the two agree to the last bit and the correction is worth nothing. On a column of large values with a small spread it is worth a great deal, and the two engines part company: on five values at two to the fifty second pandas gives a variance of 37.25 where the true value is 37.2, and a skewness of 1.4863469519931585 where the true value is 1.3253147098134046, which is twelve percent. On the suite's own int64 corpus frames, where the groups are large enough that numpy's pairwise summation gives pandas a better centre than firepanda's plain accumulation does, the correction moves firepanda towards pandas rather than away: pandas is 5.9e-6 from the true skewness of int64_half_null and firepanda is now 1.2e-16. This entry exists because on the shape of column above, and only on that shape, firepanda answers something pandas does not."
spec = "06-pandas-parity.md#the-genuine-omissions"
expect = "differs"
instead = "the moments are corrected for the centre they were measured around, so the answer does not change when a constant is added to the column. Where the two disagree, firepanda is the one nearer the value exact arithmetic gives."
since = "2026-09-05"

# The ninth. The four cases it names are listed one by one rather than as
# `divergences/zero-divisor/*`, because the fifth case in that family is the control and
# has to pass. A glob would have covered it, the suite would have required it to diverge,
# and the entry would then be asserting the opposite of the thing it exists to say.

[[divergence]]
id = "engine/zero-divisor"
cases = ["divergences/zero-divisor/floordiv-column", "divergences/zero-divisor/mod-column", "divergences/zero-divisor/floordiv-scalar", "divergences/zero-divisor/mod-scalar", "basics/bool-mod-column"]
kind = "engine"
reason = "Dividing an integer by zero has no answer, and the two engines disagree about what to write in the row that has none. pandas promotes the whole column to float64 and writes an infinity or a NaN, which costs every other row in that column its type: an int64 column with one zero divisor in it comes back float64, and every value in it above two to the fifty third is then silently rounded, so one bad row damages the good ones. firepanda writes a null, which is the value the format already has for a row with no answer, and keeps the column's width, so the rows that divided exactly stay exact. True division is not affected and is not registered here, because its answer is a float64 whatever the divisor is and there is no type to lose. The bool remainder is the one place this is visible outside the integer widths: pandas answers int8 zeros for `flag % flag` because the bool path skips the masking it applies to the integer dtypes, and firepanda widens to int8 and answers a null at the zero divisor like every other integer column."
spec = "06-pandas-parity.md#the-genuine-omissions"
expect = "differs"
instead = "the row divided by zero is null and the column keeps the dtype it started with. Floor division and the remainder on an int64 column answer int64, and `flag % flag` on two bool columns answers int8 nulls rather than int8 zeros."
since = "2026-09-06"
