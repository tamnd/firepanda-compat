# The divergence registry. Edited by people, read by the runner, and printed to users
# as docs/divergences.md, which is generated from this file and never written by hand.
#
# Every entry is an assertion and not an excuse. The runner does not skip a case listed
# here, it runs it and requires the outcome the entry declares, so an entry that stopped
# being true fails the build with a message saying the registry is out of date rather
# than a message blaming the library.
#
# Adding an entry here is done in its own pull request, reviewed on its own, and merged
# before the change that needs it. That is slower on purpose. A registry entry is a
# promise to users about what firepanda does not do, and it should never be possible to
# add one while trying to get a build green.
#
# These seven are the founding entries. They are the seven genuine omissions from the
# firepanda parity document, restated as things a suite can check.

[[divergence]]
id = "engine/plotting"
cases = ["divergences/plotting/*"]
kind = "engine"
reason = "Plotting and styling are a different library's job. pandas ships a matplotlib front end and an HTML styler, and both of them are presentation layers built on top of a dataframe rather than parts of one. firepanda raises on every plotting and styling name with a message pointing at to_pandas(), which is a one line change for a user who wants a chart and several thousand lines the library would otherwise have to carry forever."
spec = "06-pandas-parity.md#the-genuine-omissions"
expect = "raises"
since = "2026-09-04"

[[divergence]]
id = "engine/pickle"
cases = ["divergences/pickle/*"]
kind = "engine"
reason = "Reading a pickle executes whatever code is in it, so read_pickle on an untrusted file is arbitrary code execution with a friendly name. It also pins the file format to the exact class layout of the version that wrote it, which means a pickle is unreadable by any other tool and often by a later pandas. firepanda raises with a pointer to Parquet and Arrow IPC, both of which another program can read and neither of which runs anything on load."
spec = "06-pandas-parity.md#the-genuine-omissions"
expect = "raises"
since = "2026-09-04"

[[divergence]]
id = "engine/object-dtype"
cases = ["divergences/object-dtype/*"]
kind = "engine"
reason = "A column of arbitrary Python objects is a column with no type, no memory layout and no vectorized operation available to it. Every operation on one becomes a loop that reaches into the interpreter once per element, which is where the ten to one performance difference this project exists for disappears. firepanda raises at construction, naming the column and the offending Python type, so the user finds out at the point they can still fix it rather than after their program is written."
spec = "06-pandas-parity.md#the-genuine-omissions"
expect = "raises"
since = "2026-09-04"

[[divergence]]
id = "engine/inplace"
cases = ["divergences/inplace/*"]
kind = "engine"
reason = "This entry used to say that the inplace parameter was refused everywhere on the grounds that every answer here is a new frame over Arrow buffers that are shared rather than owned. That was answering a question pandas stopped asking in 3.0, where copy on write means an inplace call is not seen by a column taken out of the frame beforehand, by a copy, or by the frame when the call was made on one of its columns. firepanda honours the parameter now on the thirty one callables where the method exists, by rebinding the one slot a wrapper holds, which no buffer and no other object can tell apart from what pandas does. Spec 51 is the argument and the cases moved to fpcompat/cases/inplace.py. What is left under this entry is the seven callables whose method is not in firepanda at all: eval and query on a frame, interpolate on a frame and on a column, rename and set_names on MultiIndex, and pandas.eval. None of those refuses because of the parameter, and each will leave this entry when its method arrives."
spec = "06-pandas-parity.md#the-genuine-omissions"
expect = "raises"
raises = "NotImplementedError"
since = "2026-09-04"

[[divergence]]
id = "engine/implicit-index"
cases = ["divergences/implicit-index/*"]
kind = "engine"
reason = "pandas gives every frame an index whether or not anybody asked for one, and then performs operations against it, so loc reads as a label lookup on numbers that are actually positions and reindex against a label nobody declared returns a row of nulls. firepanda has no implicit index, so the operations that need one either take an explicit key or work positionally, and the places where that is visible are fewer than the size of this decision suggests."
spec = "06-pandas-parity.md#the-genuine-omissions"
expect = "differs"
instead = "there is no index unless one was declared. loc takes a declared key or raises, reindex against undeclared labels raises rather than manufacturing null rows, and reset_index has nothing to move into a column."
since = "2026-09-04"

[[divergence]]
id = "engine/regex-lookaround"
cases = ["divergences/regex/*"]
kind = "engine"
reason = "firepanda's regex engine has RE2 semantics, which give a linear time guarantee in exchange for dropping backreferences and lookaround. Both of those constructs need backtracking, and backtracking is what lets one adversarial pattern take exponential time. On a hundred million rows that is not a slow query, it is a hung process. A pattern using either raises with the offending construct named, because the pattern is unsupported rather than invalid and those are different words to the person reading the message."
spec = "06-pandas-parity.md#the-genuine-omissions"
expect = "raises"
since = "2026-09-04"

# The eighth entry, and the only one where firepanda is closer to the truth than pandas
# is rather than deliberately doing less. It is also the only one added after the change
# it covers rather than before it, which the rule at the top of this file says should
# not happen. Recorded rather than tidied away: the change was a precision fix that
# looked like it could only move firepanda towards pandas, and the frames where it moves
# firepanda past pandas were found by measuring afterwards.

[[divergence]]
id = "engine/moment-precision"
cases = ["divergences/moment-precision/*"]
kind = "engine"
reason = "The variance, the standard deviation, the standard error and the skewness are computed from deviations around each group's mean, and the mean is a sum divided by a count, so it is near the true mean and is not it. pandas leaves that error in. firepanda sums the plain deviations alongside the squared ones and subtracts the residual, which costs one addition per row and makes the answer independent of how accurate the centre was. On ordinary columns the two agree to the last bit and the correction is worth nothing. On a column of large values with a small spread it is worth a great deal, and the two engines part company: on five values at two to the fifty second pandas gives a variance of 37.25 where the true value is 37.2, and a skewness of 1.4863469519931585 where the true value is 1.3253147098134046, which is twelve percent. On the suite's own int64 corpus frames, where the groups are large enough that numpy's pairwise summation gives pandas a better centre than firepanda's plain accumulation does, the correction moves firepanda towards pandas rather than away: pandas is 5.9e-6 from the true skewness of int64_half_null and firepanda is now 1.2e-16. This entry exists because on the shape of column above, and only on that shape, firepanda answers something pandas does not."
spec = "06-pandas-parity.md#the-genuine-omissions"
expect = "differs"
instead = "the moments are corrected for the centre they were measured around, so the answer does not change when a constant is added to the column. Where the two disagree, firepanda is the one nearer the value exact arithmetic gives."
since = "2026-09-05"

# The ninth. The four cases it names are listed one by one rather than as
# `divergences/zero-divisor/*`, because the fifth case in that family is the control and
# has to pass. A glob would have covered it, the suite would have required it to diverge,
# and the entry would then be asserting the opposite of the thing it exists to say.

[[divergence]]
id = "engine/zero-divisor"
cases = ["divergences/zero-divisor/floordiv-column", "divergences/zero-divisor/mod-column", "divergences/zero-divisor/floordiv-scalar", "divergences/zero-divisor/mod-scalar", "basics/bool-mod-column"]
kind = "engine"
reason = "Dividing an integer by zero has no answer, and the two engines disagree about what to write in the row that has none. pandas promotes the whole column to float64 and writes an infinity or a NaN, which costs every other row in that column its type: an int64 column with one zero divisor in it comes back float64, and every value in it above two to the fifty third is then silently rounded, so one bad row damages the good ones. firepanda writes a null, which is the value the format already has for a row with no answer, and keeps the column's width, so the rows that divided exactly stay exact. True division is not affected and is not registered here, because its answer is a float64 whatever the divisor is and there is no type to lose. The bool remainder is the one place this is visible outside the integer widths: pandas answers int8 zeros for `flag % flag` because the bool path skips the masking it applies to the integer dtypes, and firepanda widens to int8 and answers a null at the zero divisor like every other integer column."
spec = "06-pandas-parity.md#the-genuine-omissions"
expect = "differs"
instead = "the row divided by zero is null and the column keeps the dtype it started with. Floor division and the remainder on an int64 column answer int64, and `flag % flag` on two bool columns answers int8 nulls rather than int8 zeros."
since = "2026-09-06"

# The tenth and eleventh, both about category columns, and both listed case by case
# rather than as `categorical/*` for the reason the ninth gives. Thirty four other cases
# in that section have to match pandas exactly and a glob would have told the suite they
# were allowed not to.

[[divergence]]
id = "engine/category-code-width"
cases = ["categorical/codes"]
kind = "engine"
reason = "pandas picks the width of a categorical's codes from how many categories there are, so a column of three categories gets int8. firepanda writes int32 whatever the count is. Picking from the cardinality means the same column encodes to a different Arrow type on different data, so a program that reads the codes has no type to write down and a file written on Monday does not have the schema of the one written on Tuesday. It is also visible through the Arrow export, which is the boundary this library is built on, so it is a decision about the dtype vocabulary rather than one about the encoder. The values agree either way, and a program comparing codes to codes is unaffected. The one that is affected is a program comparing dtypes, and that program is better off finding out."
spec = "27-what-a-caller-does-with-a-category.md#three-differences-from-pandas-all-of-them-deliberate"
expect = "differs"
instead = "the codes are int32 whatever the number of categories, and a code for a row whose category is missing is null rather than the sentinel minus one, because firepanda's codes are an Arrow column with a validity bitmap and pandas' are a numpy integer array with nowhere to record absence."
since = "2026-09-11"

[[divergence]]
id = "engine/comparison-null"
cases = ["categorical/compare-eq", "categorical/compare-lt"]
kind = "engine"
reason = "Comparing a missing value to anything has no answer. pandas writes False, because the result of a comparison in pandas is a numpy bool array and a bool array has two values and nowhere to say a third thing. firepanda's result is an Arrow column with a validity bitmap, so the row that had no answer is missing rather than false. This is the whole library and not the category columns: it is already what a text or a number column answers, and the reason the category cases are the ones registered here is that they are the ones the suite currently runs. The difference matters to a caller who counts the False rows, since the pandas count folds the rows that were missing in with the rows that genuinely did not match, and there is no way back from that number to either one."
spec = "28-comparing-a-category.md#nulls-follow-the-library-rather-than-pandas"
expect = "differs"
instead = "a row whose value is missing compares to null rather than to False, so the result has three states and the caller can tell a row that did not match from a row that had nothing to match. A category column inherits this from the rest of the library rather than restating it."
since = "2026-09-11"

# The twelfth. A count and a position are integers, and this is the second entry about
# what happens when an integer column has a row with no answer in it. The ninth is the
# same shape from the other direction: there a divisor of zero was the row with no
# answer, here it is a missing string, and both times pandas widens the column and
# firepanda writes a null.

[[divergence]]
id = "engine/string-count-width"
cases = ["strings/len", "strings/find", "strings/rfind"]
frames = ["strings_null_heavy"]
kind = "engine"
reason = "How many characters a row has and where a substring sits in it are both integers, and both are unanswerable on a row that is missing. pandas has nowhere to put that in a numpy int64 array, so it widens the whole column to float64 and writes a NaN, and every count in the column becomes a float because one row had nothing to count. firepanda answers int64 with a null in that row, which is the type the question has and the value the format already has for a row with no answer. The cost of the pandas answer is not theoretical: a position above two to the fifty third does not survive the trip through a float, and a caller who wanted to index with the number gets a float back and has to cast it. A column with no missing rows in it is int64 in pandas too, which is why this entry names one frame: on the other three text frames the two engines agree to the last bit and the suite requires them to."
spec = "30-a-position-in-a-string.md#the-library-already-counted-and-it-counted-bytes"
expect = "differs"
instead = "str.len, str.find and str.rfind answer int64 with a null on a missing row, rather than float64 with a NaN. The counts and positions themselves agree."
since = "2026-09-11"

# The thirteenth, and the first entry in the file to narrow itself to a frame. It says
# the same thing the eleventh does, about a different kind of predicate and by way of a
# different pandas decision, and it is separate from it because the eleventh is true on
# every frame it covers and this one is only true where a row is missing.

[[divergence]]
id = "engine/string-predicate-null"
cases = ["strings/startswith", "strings/endswith"]
frames = ["strings_null_heavy"]
kind = "engine"
reason = "Asking whether a missing string starts with a letter has no answer, and firepanda writes a null for the same reason engine/comparison-null gives: the result is an Arrow column with a validity bitmap and there is a place to say so. pandas writes False, and the road it takes there is worth naming because it is not the numpy one the comparison entry describes. pandas has two string backends. Its default str dtype carries missing values as NaN and its predicates fill those rows with False deliberately, while its own nullable string dtype answers NA and agrees with firepanda exactly. So this is a difference from one of pandas' two answers rather than from both, and a user who wants the firepanda behaviour in pandas can already have it by asking for the other dtype. It matters to anyone counting the False rows, since that count folds the rows that had no answer in with the rows that genuinely did not match and there is no way back from the number to either one."
spec = "30-a-position-in-a-string.md#the-library-already-counted-and-it-counted-bytes"
expect = "differs"
instead = "str.startswith and str.endswith answer null on a missing row rather than False, so the mask has three states and a caller can tell a row that did not match from a row that had nothing to match."
since = "2026-09-11"

# The thirteenth and fourteenth, and the second time after the eighth that firepanda is
# the one giving the answer arithmetic gives. They are one difference split into two
# entries because the registry narrows to frames per entry rather than per case, and the
# two halves are visible on different frames.

[[divergence]]
id = "engine/window-infinity"
cases = ["windows/rolling-min-periods", "windows/rolling-window-one", "windows/expanding-sum", "windows/expanding-mean", "windows/expanding-min", "windows/expanding-max", "windows/expanding-min-periods"]
frames = ["float64_no_nulls", "float64_half_null"]
kind = "engine"
reason = "pandas cannot get an infinity back out of a window and firepanda can, and the reason is one line of Python rather than a property of any kernel. The last thing pandas.core.window.rolling.BaseWindow._prep_values does before handing the column to a kernel is three lines under the comment `Convert inf to nan for C funcs`, which replace every infinity in the column with a NaN. So an infinity in a pandas rolling or expanding window is a missing value, and the window is reduced over the rows either side of it. Measured on pandas 3.0.3, the expanding sum over the suite's own float64 frame answers the largest finite double from row five onward, where the window holds both a positive and a negative infinity and the arithmetic says NaN, and it answers that same finite number where the window holds only one of them and the arithmetic says an infinity. The extremes go the same way for the same reason, so an expanding max over a column whose second row is a positive infinity answers the largest finite value it has seen instead, for every row after it. count is the one reduction of the ten that does not see the replacement, because it reads the presence indicator rather than the values, so pandas will report that a window holds two values and then answer the sum of one of them. This is the window layer and not pandas as a whole: pd.Series([1.0, float('inf')]).sum() is an infinity and .max() is an infinity, and only rolling and expanding lose them. firepanda counts the two infinities beside the finite total and assembles the answer from the three at the end, and its extremes treat an infinity as the ordinary value it is, so both survive the row that carried them leaving the window again."
spec = "31-a-window-is-a-pair-of-rows.md#why-the-reductions-are-carried-and-what-that-costs"
expect = "differs"
instead = "a window that holds an infinity answers that infinity, a window that holds one of each sign answers a NaN, and both are still right after the row that carried the infinity has left the window again. Every window with no infinity in it agrees with pandas to the last bit, which is why this entry names two frames and not the other two the same cases run on."
since = "2026-09-11"

[[divergence]]
id = "engine/window-infinity-dense"
cases = ["windows/rolling-sum", "windows/rolling-mean", "windows/rolling-min", "windows/rolling-max", "windows/rolling-center", "windows/rolling-center-even", "windows/rolling-closed"]
frames = ["float64_no_nulls"]
kind = "engine"
reason = "The difference engine/window-infinity describes, on the seven cases where it is only visible on the frame with nothing missing in it. Each of these asks for a four or five row window and does not set min_periods, so the window has to hold as many values as it has rows before it answers at all. The half null corpus frame has a missing value in every other row, so a window that narrow never fills, both engines answer NaN in every row, and the suite requires them to agree there. On the frame with no nulls the windows do fill, they reach the positive infinity in row one and the negative infinity in row two, and the two engines part company for the reasons the other entry gives. This is a second entry rather than a longer case list on the first one because an entry narrows to frames as a whole rather than case by case, and folding these seven in would have told the suite that a five row window over a half null column has to differ from pandas, which is the opposite of what is true."
spec = "31-a-window-is-a-pair-of-rows.md#why-the-reductions-are-carried-and-what-that-costs"
expect = "differs"
instead = "a window that holds an infinity answers that infinity and a window that holds one of each sign answers a NaN, the same as engine/window-infinity. On the half null frame, and on the int64 and tall frames these cases also run on, there is no infinity in reach and the two engines agree exactly."
since = "2026-09-11"

# The fifteenth, and the first that is about a signature rather than an answer. It is
# here because the frame form of a window arrived in firepanda and made this case
# reachable, and it was absent rather than passing before that.

[[divergence]]
id = "engine/rolling-max-varargs"
cases = ["signature/rolling.max"]
frames = ["empty"]
kind = "engine"
reason = "pandas declares Rolling.max as (numeric_only=False, *args, engine=None, engine_kwargs=None, **kwargs) and it is the only one of the ten window reductions that does. Rolling.sum, Rolling.mean, Rolling.min and all five of the Expanding ones take numeric_only, engine and engine_kwargs and nothing else, and Expanding.max takes exactly those three as well. The two extra parameters are not read. The body of the method is a single call to super().max(numeric_only=..., engine=..., engine_kwargs=...), so args and kwargs are collected and dropped, and s.rolling(2).max(False, out=None) silently ignores out rather than refusing it. Their documentation in the method's own docstring says they are positional and keyword arguments passed into func, and there is no func in a maximum. firepanda declares the same three parameters on all ten reductions, which means nine of the ten match pandas exactly and this one does not. Copying the accident would mean writing a signature that accepts anything and ignores it, which is the one thing this library refuses to do everywhere else, and it would have to be written on Rolling.max alone to be faithful, so the generator that emits one table for both classes would gain a special case for a parameter nobody can use."
spec = "31-a-window-is-a-pair-of-rows.md#the-python-surface-and-the-four-arguments-that-are-declared-and-refused"
expect = "differs"
instead = "Rolling.max takes numeric_only, engine and engine_kwargs, the same three the other nine reductions take, and refuses anything else by name. A caller who was relying on the extra parameters was relying on pandas throwing them away."
since = "2026-09-11"

# The sixteenth and seventeenth, which arrived when var, std and sem landed on rolling
# and expanding and made six runs reachable that were absent before. They are separate
# entries because they are separate mechanisms and one of them is not about infinities
# at all. The rolling one is about whether a carried variance can come back from an
# overflow. The expanding one is the thirteenth entry again, on a window that never lets
# go of a row, with pandas' own overflow sitting on top of it.

[[divergence]]
id = "engine/window-spread-overflow"
cases = ["windows/rolling-var", "windows/rolling-std", "windows/rolling-sem"]
frames = ["float64_no_nulls"]
kind = "engine"
reason = "A rolling variance is carried from one window to the next in both engines, because recomputing it would cost the width of the window on every row, and a carried sum of squared deviations can overflow. Row five of the suite's float64 frame is the largest finite double, so the first three eight row windows that are full and reach it overflow in both engines, both answer an infinity, and the suite requires them to agree there. Row thirteen is the first window that has let go of that value again. firepanda checks the error bound it carries beside the sum before it answers, an infinite sum fails that check, and it rebuilds from the eight rows in front of it and answers 8.758845844921883e+30. pandas carries the infinity forward and answers an infinity for that row and for the fifty remaining rows of the frame, so 51 of the 64 rows differ and every one of them is a row where the window holds nothing unusual. The bound firepanda carries is not only for this: it fires whenever a value much larger than the rest leaves the window and the running answer has lost its meaning, which happens on ordinary data and not only at the top of the float range."
spec = "31-a-window-is-a-pair-of-rows.md#a-carried-variance-needs-to-know-when-to-stop-being-carried"
expect = "differs"
instead = "a window whose sum of squared deviations overflowed is rebuilt from its own rows once the value that overflowed it has left, so the answer is finite again as soon as the data is. The row that genuinely overflows still answers an infinity, because that is what the arithmetic over those eight values says. On the tall frame these three cases also run on there is nothing near the top of the float range, nothing overflows, and the two engines agree to the last bit."
since = "2026-09-11"

[[divergence]]
id = "engine/window-spread-infinity"
cases = ["windows/expanding-var", "windows/expanding-std", "windows/expanding-sem"]
frames = ["float64_no_nulls"]
kind = "engine"
reason = "An expanding window never lets go of a row, so the positive infinity in row one and the negative infinity in row two are inside every window from row one to the end of the frame and there is no recovery to argue about. firepanda answers NaN for all of them, which is what a spread around a mean that is not a number is. pandas replaces both infinities with missing values before the kernel runs, for the reason engine/window-infinity gives, so it sees a column that is two rows shorter instead. At row four its window holds a negative zero and the smallest denormal and it answers zero where firepanda answers NaN. At row five the largest finite double arrives, pandas' sum of squared deviations overflows, and pandas answers an infinity for the remaining fifty nine rows. So 60 of the 64 rows differ, and only row four is the replacement showing on its own rather than with an overflow on top of it. The replacement is visible in smaller data too: rolling(2, min_periods=1).var(ddof=0) over 1.0, an infinity, 2.0, 3.0 and 4.0 answers zero in the row that holds the infinity, on the reasoning that a window with one value in it has no spread, and firepanda answers NaN there."
