# Actions are pinned to commit SHAs, matching the sibling repositories.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: Harness checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Lint
        run: |
          [ -n "$(find fpcompat -name '*.py' -print -quit)" ] || {
            echo "::notice::no harness yet"; exit 0; }
          uvx ruff check . && uvx ruff format --check .

      # No version is written here. All three are read out of the committed
      # inventory, so the denominator and the environment that checks it cannot
      # drift apart. Python is in the list because it belongs there: pandas 3.0.3
      # reports 3266 parameters on Python 3.12 and 3267 on 3.14, since
      # Timestamp.fromisoformat only shows its parameter to inspect.signature on
      # the newer one. Upgrading any of the three is a commit that regenerates the
      # file, which is the point.
      - name: Pin the environment to the committed inventory
        id: pins
        run: |
          file=$(ls surface/pandas-*.json 2>/dev/null | sort -V | tail -1)
          if [ -z "$file" ]; then
            echo "::notice::no committed inventory yet"
            { echo "pandas=3.0.3"; echo "pyarrow=25.0"; echo "python=3.14"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for key in pandas pyarrow python; do
            value=$(jq -r --arg k "$key" '.[$k]' "$file")
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done
          echo "::notice::$(jq -r '"pandas \(.pandas), pyarrow \(.pyarrow), python \(.python)"' "$file")"

      - name: Tests
        run: |
          [ -n "$(find tests -name 'test_*.py' -print -quit)" ] || {
            echo "::notice::no tests yet"; exit 0; }
          uvx --python "${{ steps.pins.outputs.python }}" \
            --with "pandas==${{ steps.pins.outputs.pandas }}" \
            --with "pyarrow==${{ steps.pins.outputs.pyarrow }}.*" \
            --with pytest pytest -q

      # The frames are not committed, so this both proves they still generate and
      # proves they generate the same. A digest that moved without the manifest
      # moving means the inputs changed under a conformance number that did not,
      # and that is the one failure mode a suite cannot detect from its own results.
      - name: Corpus is current
        run: |
          [ -f fpcompat/corpus.py ] || { echo "::notice::no corpus yet"; exit 0; }
          uvx --python "${{ steps.pins.outputs.python }}" \
            --with "pandas==${{ steps.pins.outputs.pandas }}" \
            --with "pyarrow==${{ steps.pins.outputs.pyarrow }}.*" \
            python -m fpcompat.corpus --check

      # pandas against pandas, through the full pipeline. A perfect score or the
      # build fails, because a harness that disagrees with itself has no business
      # publishing a number about anything else. docs/specs/05-comparison.md.
      - name: Oracle
        run: |
          [ -f fpcompat/runner.py ] || { echo "::notice::no runner yet"; exit 0; }
          uvx --python "${{ steps.pins.outputs.python }}" \
            --with "pandas==${{ steps.pins.outputs.pandas }}" \
            --with "pyarrow==${{ steps.pins.outputs.pyarrow }}.*" \
            python -m fpcompat.runner --engine pandas --oracle

      # A generated page that drifts is worse than no page at all, because a user
      # reads it and believes it. docs/specs/06-divergences.md.
      - name: Divergence page is current
        run: |
          [ -f fpcompat/divergences.py ] || { echo "::notice::no registry yet"; exit 0; }
          uvx --python "${{ steps.pins.outputs.python }}" \
            --with "pandas==${{ steps.pins.outputs.pandas }}" \
            --with "pyarrow==${{ steps.pins.outputs.pyarrow }}.*" \
            python -m fpcompat.divergences --check

      # The committed inventory has to match the pandas in the environment, or every
      # coverage number computed from it is stale. Regenerating it is one task and
      # the diff is the work list, so a mismatch is a failure with a fix attached.
      - name: Inventory is current
        run: |
          [ -f fpcompat/surface.py ] || { echo "::notice::no surface tool yet"; exit 0; }
          uvx --python "${{ steps.pins.outputs.python }}" \
            --with "pandas==${{ steps.pins.outputs.pandas }}" \
            --with "pyarrow==${{ steps.pins.outputs.pyarrow }}.*" \
            python -m fpcompat.surface --check

      # Renders the oracle run the previous step just wrote, into the job summary so
      # that the numbers are visible without downloading anything, and into the site
      # so that a page which fails to render is a red build rather than a discovery
      # made on publication day. This step is not a gate on the score. It prints
      # whatever it read. docs/specs/07-scoreboard.md.
      - name: Scoreboard
        run: |
          [ -f fpcompat/report.py ] || { echo "::notice::no report yet"; exit 0; }
          uvx --python "${{ steps.pins.outputs.python }}" \
            --with "pandas==${{ steps.pins.outputs.pandas }}" \
            --with "pyarrow==${{ steps.pins.outputs.pyarrow }}.*" \
            python -m fpcompat.report --site site
          {
            echo '### Oracle scoreboard'
            echo
            uvx --python "${{ steps.pins.outputs.python }}" \
              --with "pandas==${{ steps.pins.outputs.pandas }}" \
              --with "pyarrow==${{ steps.pins.outputs.pyarrow }}.*" \
              python -m fpcompat.report
          } >> "$GITHUB_STEP_SUMMARY"

      # The one gate on a number. It applies to the conformance run against
      # firepanda and not to the oracle, so it stays quiet until there is a driver
      # to produce one. A ratchet and not a threshold: a threshold on a young
      # project is either so low it means nothing or so high it blocks the work
      # that would raise it, and people learn to route around both. What this
      # refuses is going backwards.
      - name: Conformance ratchet
        run: |
          [ -f results/firepanda.json ] || {
            echo "::notice::no conformance run yet, the ratchet starts when the driver does"
            exit 0; }
          uvx --python "${{ steps.pins.outputs.python }}" \
            --with "pandas==${{ steps.pins.outputs.pandas }}" \
            --with "pyarrow==${{ steps.pins.outputs.pyarrow }}.*" \
            python -m fpcompat.report --ratchet --results results/firepanda.json

      # operations.json is read by firepanda-bench to say which operations a query is
      # made of, so a row added or renamed here has to show up as a diff rather than as
      # a link that quietly points at nothing.
      - name: Operation table is current
        run: |
          [ -f fpcompat/budget.py ] || { echo "::notice::no budget yet"; exit 0; }
          uvx --python "${{ steps.pins.outputs.python }}" \
            --with "pandas==${{ steps.pins.outputs.pandas }}" \
            --with "pyarrow==${{ steps.pins.outputs.pyarrow }}.*" \
            python -m fpcompat.budget --operations --check

      # The budget frames are not committed either, and this proves they still
      # generate and still generate the same thing. Ten thousand rows and not a
      # million, because the digest is sampled from both ends and a change to the
      # generator shows up in the first row.
      - name: Budget corpus is current
        run: |
          [ -f fpcompat/budget.py ] || { echo "::notice::no budget yet"; exit 0; }
          uvx --python "${{ steps.pins.outputs.python }}" \
            --with "pandas==${{ steps.pins.outputs.pandas }}" \
            --with "pyarrow==${{ steps.pins.outputs.pyarrow }}.*" \
            python -m fpcompat.budget --check --rows 10000

      # Runs the whole cost matrix at ten thousand rows, where every timing is noise
      # and the point is that all fifty three operations are spelled correctly in
      # whatever pandas is pinned. The numbers are thrown away and no gate reads them,
      # because a timing gate on a shared runner fails on a noisy neighbour and passes
      # on a real regression that happened to land on a quiet one. The gate lives in
      # `pixi run budget-gate` and belongs on a machine that is always the same one.
      - name: Cost matrix runs
        run: |
          [ -f fpcompat/budget.py ] || { echo "::notice::no budget yet"; exit 0; }
          uvx --python "${{ steps.pins.outputs.python }}" \
            --with "pandas==${{ steps.pins.outputs.pandas }}" \
            --with "pyarrow==${{ steps.pins.outputs.pyarrow }}.*" \
            python -m fpcompat.budget --rows 10000 --repeats 1
          {
            echo '### Cost matrix, pandas at 10k rows, one repeat, timings meaningless'
            echo
            uvx --python "${{ steps.pins.outputs.python }}" \
              --with "pandas==${{ steps.pins.outputs.pandas }}" \
              --with "pyarrow==${{ steps.pins.outputs.pyarrow }}.*" \
              python -m fpcompat.budget --matrix --rows 10000
          } >> "$GITHUB_STEP_SUMMARY"

  links:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --no-progress --max-concurrency 4 './**/*.md'
          fail: true
