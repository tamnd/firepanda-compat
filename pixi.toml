[workspace]
name = "firepanda-compat"
version = "0.1.0"
description = "The pandas conformance suite for firepanda"
authors = ["tamnd <tamnd87@gmail.com>"]
license = "Apache-2.0"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "osx-64"]

# The dependency set is deliberately four packages. A conformance run has to be
# cheap enough to sit on every pull request to the library, and every package added
# here is a package that has to solve on four platforms before a case can run.
# Polars, DuckDB and cuDF belong to firepanda-bench and are not welcome in this
# environment, because the oracle is pandas and there is one oracle.
#
# The three version pins below are the ones named in surface/pandas-3.0.3.json and
# they are pins rather than ranges. The inventory is a function of all three:
# pandas 3.0.3 reports 3266 parameters on Python 3.12 and 3267 on 3.14, because
# Timestamp.fromisoformat only shows its parameter to inspect.signature on the
# newer one. Loosening any of these means a contributor regenerates the inventory
# and gets a diff that is about their laptop rather than about pandas.
#
# pandas is pinned to the exact patch and pixi.lock is committed, which is the
# other half of that. Both are here because `pandas = "3.0.*"` and no lockfile is
# how this environment silently became pandas 3.0.5 while the committed inventory
# said 3.0.3, and the check that caught it is the one PR #3 added. As it happens
# 3.0.5 walks to exactly the same 1413 names, 1125 callables, 3267 parameters and
# 153 properties, so moving to it is a one line change plus a regenerated file
# rather than a project. The point is that the move is a commit.
[dependencies]
python = "3.14.*"
# 3.0 and not 2.x. The target is one major version of pandas and a suite that
# straddles two spends its life on the differences between them rather than on the
# differences that matter. The exact version is recorded in every result file,
# because a conformance claim without the pandas version attached is not a claim.
pandas = "==3.0.3"
pyarrow = "25.0.*"
pytest = "*"

# The Mojo toolchain is not here. It lives in the firepanda checkout, pinned by
# that repository, and `drivers/firepanda` is built with it. Two pins for one
# toolchain is how a driver ends up compiled against a library it does not match.

[tasks]
# Walks the 21 pandas namespaces and writes the committed inventory. Run it when
# pandas moves; the diff is the work list.
surface = "python -m fpcompat.surface"

# Regenerates the frames from the seed and verifies every digest in the manifest.
corpus = "python -m fpcompat.corpus"

# pandas against pandas, through the whole pipeline. Anything other than a perfect
# score is a bug in this repository, and no number it produces is publishable until
# it is fixed. This runs on every commit here.
oracle = "python -m fpcompat.runner --engine pandas --oracle"

# pandas against firepanda. Needs either an importable firepanda, which arrives at
# M3, or a built driver in drivers/firepanda.
conformance = "python -m fpcompat.runner --engine firepanda"

# Regenerates docs/divergences.md from fpcompat/divergences.toml. The page is the
# public list of everything firepanda deliberately does differently, and it is
# generated rather than written so it cannot fall behind the registry.
divergences = "python -m fpcompat.divergences --page"

# The scoreboard: the summary line and the per section table, read out of the last
# result file. It prints whatever it read. There is no threshold below which it
# declines to print, because the run that lost is the run worth publishing.
report = "python -m fpcompat.report"

# The three pages, into the gitignored site directory. Generated on every run and
# never committed, so a stale number cannot sit in the repository looking current.
site = "python -m fpcompat.report --site site"

# Fails when a section's L3 count is below the committed floor in ratchet.json, or
# when the failure count went up. A ratchet and not a threshold: what it refuses is
# going backwards, and raising the floor is part of the pull request that earns it.
ratchet = "python -m fpcompat.report --ratchet --results results/firepanda.json"

# Which pandas names and which parameters no case has ever touched. An uncovered
# parameter is not a pass and it is not a failure, it is a hole in the measurement.
coverage = "python -m fpcompat.report --coverage"

# The operation level cost matrix: wall clock and peak resident set per operation
# against pandas, on the budget corpus. docs/specs/09-resources.md.
budget = "python -m fpcompat.budget"

test = "pytest -q"
lint = "ruff check . && ruff format --check ."
